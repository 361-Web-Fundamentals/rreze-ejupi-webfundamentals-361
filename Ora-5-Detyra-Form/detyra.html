<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Formulari i Regjistrimit</title>
  <link rel="stylesheet" href="detyra.css">
</head>
<body>

  <div class="forma-karta">
    <h2>Formulari i Regjistrimit</h2>

    <form action="#" method="POST">

      <label for="emri">Emri</label><br>
      <input type="text" id="emri" name="emri" class="fusha-teksti" placeholder="Shkruaj emrin" required><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" class="fusha-teksti" placeholder="Shkruaj email-in" required><br><br>

      <label for="fjalekalimi">Fjalëkalimi</label><br>
      <input type="password" id="fjalekalimi" name="fjalekalimi" class="fusha-teksti" required><br><br>

      <p class="titull-grupi">Gjinia:</p>
      <label for="mashkull">Mashkull</label>
      <input type="radio" id="mashkull" name="gjinia" value="mashkull" class="kutize">

      <label for="femer">Femër</label>
      <input type="radio" id="femer" name="gjinia" value="femer" class="kutize" checked>
      <br><br>

      <p class="titull-grupi">Hobi:</p>
      <label for="sport">Sport</label>
      <input type="checkbox" id="sport" name="sport" class="kutize">

      <label for="muzike">Muzikë</label>
      <input type="checkbox" id="muzike" name="muzike" class="kutize" checked>

      <label for="lexim">Lexim</label>
      <input type="checkbox" id="lexim" name="lexim" class="kutize">
      <br><br>

      <label for="bio">Biografia</label><br>
      <textarea id="bio" name="bio" class="fusha-teksti" rows="4" placeholder="Shkruaj diçka për veten..."></textarea><br><br>

      <label for="fusha">Fusha e Interesit</label><br>
      <select id="fusha" name="fusha" class="fusha-teksti">
        <option value="it">Teknologji Informacioni</option>
        <option value="marketing">Marketing</option>
        <option value="menaxhim">Menaxhim</option>
      </select><br><br>

      <button type="submit" class="buton-dergo">Dërgo</button>
      <button type="reset" class="buton-pastro">Pastro</button>

    </form>
  </div>

</body>
</html>
