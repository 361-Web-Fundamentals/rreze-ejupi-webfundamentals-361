<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="contact-form.css" />
  </head>
  <body>
    <div class="kontakt-karta">
      <h2>Na Kontaktoni</h2>

      <form>
        <label for="emri">Emri:</label><br>
        <input type="text" id="emri" name="emri" placeholder="Shkruaj emrin" />
        <br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Shkruaj emailin">
        <br><br>

        <label for="mesazhi">Mesazhi</label><br>
        <textarea id="mesazhi" name="mesazhi" rows="5" placeholder="Shkruaj mesazhin..."></textarea>
        <br><br>

        <button type="sumbit">Dergo Mesazhin</button>

      </form>
    </div>
  </body>
</html>
