<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Na Kontaktoni</title>
  <link rel="stylesheet" href="contact-form.css">
</head>
<body>

  <div class="kontakt-karta">
    <h2>Na Kontaktoni</h2>

    <form action="#" method="POST">
      <label for="emri">Emri</label><br>
      <input type="text" id="emri" name="emri" placeholder="Shkruaj emrin"><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email" placeholder="Shkruaj email-in"><br><br>

      <label for="mesazhi">Mesazhi</label><br>
      <textarea id="mesazhi" name="mesazhi" rows="5" placeholder="Shkruaj mesazhin..."></textarea><br><br>

      <button type="submit">Dërgo Mesazhin</button>
    </form>
  </div>

</body>
</html>
